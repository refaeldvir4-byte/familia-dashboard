  });

});

function fitK(){return Math.max(Math.min(innerWidth/(planeW+80),innerHeight/(planeH+80)),MINK)}

vp.addEventListener('pointerdown',e=>{vp.setPointerCapture(e.pointerId);pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  moved=false;dXY={x:e.clientX,y:e.clientY};const nd=e.target.closest('.node');
  if(pts.size===2){const p=[...pts.values()];mode='pinch';pz={d:d2(p[0],p[1]),mx:(p[0].x+p[1].x)/2,my:(p[0].y+p[1].y)/2,k,tx,ty}}
  else if(nd){mode='tap';tapId=nd.dataset.id}else{mode='pan';last={x:e.clientX,y:e.clientY};vp.classList.add('grabbing')}});
vp.addEventListener('pointermove',e=>{if(!pts.has(e.pointerId))return;pts.set(e.pointerId,{x:e.clientX,y:e.clientY});

  if(mode==='pinch'&&pts.size>=2){const p=[...pts.values()],d=d2(p[0],p[1]);let nk=cl(pz.k*d/pz.d,MINK,MAXK);

  else if(mode==='tap'&&moved){mode='pan';last={x:e.clientX,y:e.clientY};vp.classList.add('grabbing')}});
