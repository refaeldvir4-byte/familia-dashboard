<style>

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

  #viewport{position:fixed;inset:0;overflow:hidden;touch-action:none;cursor:grab;
    background:radial-gradient(1200px 800px at 60% 40%, #12101c 0%, var(--ink) 70%)}
  #viewport.grabbing{cursor:grabbing}
  #world{position:absolute;top:0;left:0;transform-origin:0 0;will-change:transform}
  #links{position:absolute;top:0;left:0;overflow:visible;pointer-events:none}
  .gframe{position:absolute;border:1.5px solid rgba(201,168,76,.18);border-radius:26px;
    background:rgba(255,255,255,.012);box-shadow:inset 0 0 60px rgba(201,168,76,.04)}
  .glabel{position:absolute;font-weight:800;font-size:22px;letter-spacing:.3px;
    padding:2px 10px;white-space:nowrap;text-shadow:0 2px 10px #000}
  .node{position:absolute;width:230px;background:linear-gradient(160deg,var(--panel2),var(--panel));
    border:1px solid var(--line);border-radius:15px;padding:11px 13px 12px;cursor:pointer;
    box-shadow:0 10px 26px rgba(0,0,0,.45);transition:border-color .15s,transform .12s,box-shadow .15s}
  .node:hover{border-color:var(--gold);transform:translateY(-2px);box-shadow:0 16px 34px rgba(0,0,0,.6)}
  .node.dim{opacity:.28;filter:grayscale(.4)}
  .node.sel{border-color:var(--gold2);box-shadow:0 0 0 2px var(--gold2),0 16px 40px rgba(0,0,0,.7)}
  .node .top{display:flex;align-items:center;gap:8px;margin-bottom:5px}
  .node .ic{font-size:20px;line-height:1}
  .node .ttl{font-weight:800;font-size:15px;flex:1;line-height:1.2}
  .node .sub{font-size:12px;color:var(--dim);line-height:1.35;min-height:16px}
  .node .dot{width:9px;height:9px;border-radius:50%;flex:none;box-shadow:0 0 8px currentColor}
  .s-live{color:var(--live)} .s-active{color:var(--active)} .s-prog{color:var(--prog)}
  .s-ready{color:var(--ready)} .s-blocked{color:var(--blocked)} .s-idea{color:var(--idea)} .s-archive{color:var(--archive)}

  #hud .brand small{display:block;font-weight:600;font-size:11px;color:var(--dim);letter-spacing:3px}
  #hud .spacer{flex:1}

  #tools button{pointer-events:auto;width:44px;height:44px;border-radius:12px;border:1px solid var(--line);
    background:var(--panel);color:var(--gold2);font-size:20px;font-weight:800;cursor:pointer}
  #tools button:active{background:var(--panel2)}

  #detail h2{margin:6px 0 2px;font-size:23px;color:var(--gold2)}
  #detail .dstatus{font-size:13px;font-weight:700;margin-bottom:2px}
  #detail .dsub{color:var(--dim);font-size:14px;margin-bottom:14px;line-height:1.5}

  #hint{position:fixed;top:54px;left:50%;transform:translateX(-50%);color:var(--dim);font-size:12px;z-index:4;

/* ============================= LAYOUT ============================= */
const NW=230, NH=118, GAPX=26, GAPY=24, PAD=30, LBL=40;
const byId={};
function layout(){
  const groups={};
  NODES.forEach(n=>{(groups[n.group]=groups[n.group]||[]).push(n)});
  for(const g in groups){
    const G=GROUPS[g], cols=G.cols;
    groups[g].forEach((n,i)=>{
      const c=i%cols, r=(i/cols|0);
      n.x=G.x+PAD+c*(NW+GAPX);
      n.y=G.y+LBL+PAD+r*(NH+GAPY);
      n.w=NW; n.h=NH; byId[n.id]=n;
    });
    // frame bounds
    const xs=groups[g].map(n=>n.x), ys=groups[g].map(n=>n.y);
    G.fx=Math.min(...xs)-PAD; G.fy=Math.min(...ys)-PAD-LBL;
    G.fw=(Math.max(...xs)+NW+PAD)-G.fx; G.fh=(Math.max(...ys)+NH+PAD)-G.fy;
  }
}
layout();

/* ============================= RENDER ============================= */
const world=document.getElementById('world'), svg=document.getElementById('links'), vp=document.getElementById('viewport');
let planeW=0,planeH=0;
for(const g in GROUPS){planeW=Math.max(planeW,GROUPS[g].fx+GROUPS[g].fw+60);planeH=Math.max(planeH,GROUPS[g].fy+GROUPS[g].fh+60)}
svg.setAttribute('width',planeW);svg.setAttribute('height',planeH);
svg.setAttribute('viewBox',`0 0 ${planeW} ${planeH}`);

// group frames + labels
for(const g in GROUPS){const G=GROUPS[g];
  const f=document.createElement('div');f.className='gframe';
  f.style.cssText=`left:${G.fx}px;top:${G.fy}px;width:${G.fw}px;height:${G.fh}px;border-color:${hex2rgba(G.color,.22)}`;
  world.appendChild(f);
  const l=document.createElement('div');l.className='glabel';l.textContent=G.label;
  l.style.cssText=`left:${G.fx+16}px;top:${G.fy+6}px;color:${G.color}`;
  world.appendChild(l);
}
// links (draw first, behind nodes)
const linkEls=[];
NODES.forEach(n=>{(n.connections||[]).forEach(t=>{const m=byId[t];if(!m)return;
  const p=document.createElementNS('http://www.w3.org/2000/svg','path');
  const x1=n.x+NW/2,y1=n.y+NH/2,x2=m.x+NW/2,y2=m.y+NH/2;
  const dx=(x2-x1)*0.4;
  p.setAttribute('d',`M${x1},${y1} C${x1+dx},${y1} ${x2-dx},${y2} ${x2},${y2}`);
  p.setAttribute('fill','none');p.setAttribute('stroke','rgba(201,168,76,.28)');p.setAttribute('stroke-width','1.6');
  svg.appendChild(p);linkEls.push({p,a:n.id,b:t});
})});
// nodes
NODES.forEach(n=>{
  const el=document.createElement('div');el.className='node';el.dataset.id=n.id;
  el.style.cssText=`left:${n.x}px;top:${n.y}px;width:${NW}px`;
  const st=STATUS[n.status];
  el.innerHTML=`<div class="top"><span class="ic">${n.icon}</span><span class="ttl">${n.title}</span>
     <span class="dot ${st[0]}">●</span></div><div class="sub">${n.sub||''}</div>`;
  el.addEventListener('click',ev=>{ev.stopPropagation();openDetail(n.id)});
  world.appendChild(el);n.el=el;
});

function hex2rgba(h,a){const n=parseInt(h.slice(1),16);return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`}

/* ============================= PAN / ZOOM ============================= */
let tx=0,ty=0,k=1;const MINK=0.2,MAXK=2.2;
function apply(){world.style.transform=`translate(${tx}px,${ty}px) scale(${k})`}
function fit(){
  const vw=innerWidth,vh=innerHeight;
  k=Math.min(vw/(planeW+80),vh/(planeH+80),1);k=Math.max(k,MINK);
  tx=(vw-planeW*k)/2; ty=(vh-planeH*k)/2 + 10; apply();
}
fit();addEventListener('resize',()=>{});

const pts=new Map();let mode=null,last=null,pinch0=null,downNode=null,downXY=null,moved=false;
vp.addEventListener('pointerdown',e=>{
  vp.setPointerCapture(e.pointerId);
  pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  moved=false;downXY={x:e.clientX,y:e.clientY};
  const nodeEl=e.target.closest('.node');
  if(pts.size===2){mode='pinch';const p=[...pts.values()];
    pinch0={d:dist(p[0],p[1]),mx:(p[0].x+p[1].x)/2,my:(p[0].y+p[1].y)/2,k,tx,ty};downNode=null;}
  else if(nodeEl){mode='tap';downNode=nodeEl;}
  else{mode='pan';last={x:e.clientX,y:e.clientY};vp.classList.add('grabbing');}
});
vp.addEventListener('pointermove',e=>{
  if(!pts.has(e.pointerId))return;
  pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(downXY&&Math.hypot(e.clientX-downXY.x,e.clientY-downXY.y)>8)moved=true;
  if(mode==='pinch'&&pts.size>=2){const p=[...pts.values()];const d=dist(p[0],p[1]);
    let nk=clamp(pinch0.k*d/pinch0.d,MINK,MAXK);
    // zoom around initial midpoint
    tx=pinch0.mx-(pinch0.mx-pinch0.tx)*(nk/pinch0.k);
    ty=pinch0.my-(pinch0.my-pinch0.ty)*(nk/pinch0.k);
    k=nk;apply();
  } else if(mode==='pan'&&last){tx+=e.clientX-last.x;ty+=e.clientY-last.y;last={x:e.clientX,y:e.clientY};apply();}
  else if(mode==='tap'&&moved){mode='pan';last={x:e.clientX,y:e.clientY};downNode=null;vp.classList.add('grabbing')}
});
function endPtr(e){
  if(mode==='tap'&&downNode&&!moved){/* click handler on node fires */}
  pts.delete(e.pointerId);
  if(pts.size<2&&mode==='pinch'){mode=pts.size===1?'pan':null;const r=[...pts.values()][0];if(r)last={x:r.x,y:r.y}}
  if(pts.size===0){mode=null;last=null;vp.classList.remove('grabbing')}
}
vp.addEventListener('pointerup',endPtr);vp.addEventListener('pointercancel',endPtr);
vp.addEventListener('click',()=>{});// background click closes handled below
vp.addEventListener('wheel',e=>{e.preventDefault();
  const f=e.deltaY<0?1.12:1/1.12;let nk=clamp(k*f,MINK,MAXK);
  tx=e.clientX-(e.clientX-tx)*(nk/k);ty=e.clientY-(e.clientY-ty)*(nk/k);k=nk;apply();
},{passive:false});
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function zoomBtn(f){let nk=clamp(k*f,MINK,MAXK);const cx=innerWidth/2,cy=innerHeight/2;
  tx=cx-(cx-tx)*(nk/k);ty=cy-(cy-ty)*(nk/k);k=nk;apply()}
document.getElementById('zin').onclick=()=>zoomBtn(1.25);
document.getElementById('zout').onclick=()=>zoomBtn(.8);
document.getElementById('fit').onclick=fit;

/* ============================= DETAIL PANEL ============================= */
const D=document.getElementById('detail');
function openDetail(id){const n=byId[id];if(!n)return;
  NODES.forEach(m=>m.el.classList.remove('sel'));n.el.classList.add('sel');
  document.getElementById('d-ic').textContent=n.icon;
  document.getElementById('d-ttl').textContent=n.title;
  const st=STATUS[n.status];const sEl=document.getElementById('d-status');
  sEl.textContent='● '+st[1];sEl.style.color=st[2];
  document.getElementById('d-sub').textContent=n.sub||'';
  let h='';
  if(n.details&&n.details.length){h+='<h3>מה יש בפנים</h3><ul>'+n.details.map(d=>`<li>${d}</li>`).join('')+'</ul>'}
  const outs=(n.connections||[]).map(t=>byId[t]).filter(Boolean);
  const ins=NODES.filter(m=>(m.connections||[]).includes(id));
  const rel=[...new Set([...outs,...ins])];
  if(rel.length){h+='<h3>מחובר אל</h3><div>'+rel.map(r=>`<span class="link" onclick="openDetail('${r.id}')">${r.icon} ${r.title}</span>`).join('')+'</div>'}
  document.getElementById('d-body').innerHTML=h;
  D.classList.add('open');
  // highlight related links
  linkEls.forEach(l=>l.p.setAttribute('stroke',(l.a===id||l.b===id)?'rgba(240,208,128,.9)':'rgba(201,168,76,.12)'));
  NODES.forEach(m=>m.el.classList.toggle('dim',!(m.id===id||rel.some(r=>r.id===m.id))));
}
function closeDetail(){D.classList.remove('open');
  NODES.forEach(m=>{m.el.classList.remove('sel','dim')});
  linkEls.forEach(l=>l.p.setAttribute('stroke','rgba(201,168,76,.28)'));
}
vp.addEventListener('pointerdown',e=>{if(!e.target.closest('.node')&&D.classList.contains('open'))closeDetail()});

/* ============================= SEARCH ============================= */
document.getElementById('search').addEventListener('input',e=>{
  const q=e.target.value.trim();
  if(!q){NODES.forEach(n=>n.el.classList.remove('dim','sel'));return}
  NODES.forEach(n=>{const hit=(n.title+' '+(n.sub||'')+' '+(n.details||[]).join(' ')).includes(q);
    n.el.classList.toggle('dim',!hit);n.el.classList.toggle('sel',hit)});
});

/* ============================= LEGEND ============================= */
document.getElementById('legend').innerHTML='<b>מקרא-סטטוס</b>'+
  Object.entries(STATUS).map(([k,v])=>`<div class="row"><i style="background:${v[2]}"></i>${v[1]}</div>`).join('');

// fade hint
setTimeout(()=>{const h=document.getElementById('hint');h.style.opacity=0},4200);
</script>
